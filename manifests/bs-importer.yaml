id: bs-importer
kind: plugin
runtime: native
category: migration
official: true
name:
  zh-CN: Blessing Skin 扩展数据迁移助手
  en: Blessing Skin Extension Importer
description:
  zh-CN: 按需安装、迁完可卸载的 Tier 2 原生插件：通过直连 BS 数据库或 Export Bridge 补迁 invitation_codes、mojang_verifications、textures_description 第三方插件数据
  en: On-demand Tier 2 native plugin to import Blessing Skin third-party plugin extension tables (invitation_codes, mojang_verifications, textures_description) via direct DB or Export Bridge; safe to uninstall after migration
authors:
  - Entropy-Increase-Team
license: MIT
homepage: https://github.com/Entropy-Increase-Team/skinloom-plugins
repository: https://github.com/Entropy-Increase-Team/skinloom-plugins
subdir: bs-importer
releases:
  - version: 1.0.0
    commit: ec430981efaacc48ca8d89624cada3a53c35d13f
    apiVersion: 1
    nativeProtocolVersion: 1
    targets:
      - linux/amd64
      - linux/arm64
      - windows/amd64
      - darwin/arm64
      - darwin/amd64
    engines:
      skinloom: ">=0.1.0 <2.0.0"
      go: ">=1.26.10"
    permissions:
      - admin.ui
      - native.exec
      - storage.sql
      - http.stream
      - users.read
      - textures.read
    dependencies: {}
    optionalDependencies:
      invitation-codes: "^1.0.0"
      mojang-verification: "^1.0.0"
      texture-description: "^1.0.0"
    publishedAt: "2026-11-19T13:00:00Z"
    yanked: false
    changelog: |
      - Initial official 5-platform release of Blessing Skin Extension Importer (Tier 2 Native Go).
      - Supports direct MySQL/PostgreSQL/SQLite and Blessing Skin Export Bridge imports with SSE live progress and isolated job history SQL storage.
