id: mua-union
kind: plugin
runtime: native
category: auth
official: true
name:
  zh-CN: MUA Union 联合认证
  en: MUA Union Federation
description:
  zh-CN: 官方 Tier 2 原生插件：接入中国高校 Minecraft 联盟（MUA）联合皮肤站认证体系，支持成员皮肤站白名单同步、角色跨站绑定与改名同步、联合黑名单管理及 Union OAuth2 单点登录
  en: Official Tier 2 native plugin integrating the Minecraft University Alliance (MUA) Union federation protocol: member skinDomains sync, cross-site player binding and lifecycle sync, union blacklist management, and Union OAuth2 SSO
authors:
  - Entropy-Increase-Team
license: MIT
homepage: https://github.com/Entropy-Increase-Team/skinloom-plugins
repository: https://github.com/Entropy-Increase-Team/skinloom-plugins
subdir: mua-union
releases:
  - version: 1.0.0
    commit: a7fa5b28e1ad7496077018461f8624cc036b2d4b
    apiVersion: 1
    nativeProtocolVersion: 1
    targets:
      - linux/amd64
      - linux/arm64
      - windows/amd64
      - darwin/arm64
      - darwin/amd64
    engines:
      skinloom: ">=1.1.3 <2.0.0"
      go: ">=1.26.10"
    permissions:
      - admin.ui
      - native.exec
      - storage.sql
      - routes.public
      - yggdrasil.extend
      - yggdrasil.key.write
      - players.uuid.write
      - users.read
      - players.read
      - cron
    dependencies: {}
    optionalDependencies:
      bs-importer: "^1.0.0"
    publishedAt: "2026-11-23T09:25:00Z"
    yanked: false
    changelog:
      zh-CN: |
        - 首个官方 5 平台 Tier 2 原生 Go 版本，基于 `yggdrasil-connect` 协议重构，完整兼容中国高校 Minecraft 联盟（MUA）Union 联合认证体系。
        - 支持 RSA-SHA256 `UnionHostVerify` 防重放 Webhook 验签、成员站 `skinDomains` 动态同步、玩家创建/改名/删除出站同步，以及带因果合并与租约认领的 SQL 失败重试队列。
        - 提供中英双语用户跨站绑定中心（严格角色归属权防 IDOR 校验）、管理员控制台（接入就绪检查、中心版本对比、双向连通性诊断、密钥指纹复制）与联合黑名单管理。
        - 内置 MUA Union OAuth2 单点登录（自动管理 4096 位 RSA 签名密钥对与分片 PKCS#1 v1.5 加密，严格校验用户状态与邮箱验证要求）；所有高危远端回调均默认关闭并强制要求 `superadmin` 权限与审计落盘。
        - 实现通用 `bsMigrateDescribe` / `bsMigrateImport` 迁移协议，可被官方 `bs-importer`（v1.1.0+）自动发现，支持从旧版 Blessing Skin 一键幂等迁移 MUA Union 配置、成员站列表与 OAuth2 密钥对。
      en: |
        - Initial official 5-platform Tier 2 native Go release implementing full Minecraft University Alliance (MUA) Union federation protocol compatibility.
        - Includes RSA-SHA256 `UnionHostVerify` replay-safe webhooks, dynamic member `skinDomains` sync, outbound player lifecycle sync, and a SQL retry outbox with causal coalescing and lease claiming.
        - Provides bilingual User Binding Center (with strict player ownership anti-IDOR checks), Admin Console (readiness checklist, Hub version comparison, two-way diagnostics, key fingerprints), and Union Blacklist management.
        - Supports MUA Union OAuth2 SSO with auto-managed 4096-bit RSA signing keys, chunked PKCS#1 v1.5 encryption, and strict active/email-verified enforcement; all high-risk remote webhooks are opt-in, superadmin-gated, and audited.
        - Implements the generic `bsMigrateDescribe` / `bsMigrateImport` migration protocol for automatic discovery by official `bs-importer` (v1.1.0+), enabling one-click idempotent migration of legacy Blessing Skin MUA Union options, member server list, and OAuth2 keypair.
