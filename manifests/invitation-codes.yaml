id: invitation-codes
kind: plugin
runtime: js
category: security
official: true
name:
  zh-CN: 邀请码注册
  en: Invitation Codes
description:
  zh-CN: 要求用户提供有效邀请码方可注册账号，支持次数限制、过期时间、积分兑换邀请码与管理员批量生成导出
