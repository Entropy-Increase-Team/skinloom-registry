    changelog:
      zh-CN: |
        - 补全注册拦截、管理员接口与玩家自助兑换全链路中英双语错误提示与状态标签。
        - 新增删除邀请码确认弹窗，默认前缀/次数/有效期自动读取插件设置，并补充导入空白备注兜底。
        - 优化移动端按钮触控热区、状态筛选条横向滚动与列表加载失败告警展示。
